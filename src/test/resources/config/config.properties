# Active environment ? override at runtime: mvn test -Denv=staging
env=qa

# Base URLs per environment
dev.base.url=https://jsonplaceholder.typicode.com
qa.base.url=https://jsonplaceholder.typicode.com
staging.base.url=https://staging-api.yourcompany.com
prod.base.url=https://api.yourcompany.com

# Timeouts (ms)
connection.timeout=10000
read.timeout=30000

# Auth ? leave blank if not required; use env vars in CI for secrets
# auth.token=

auth.type=bearer
auth.token=your_token_here